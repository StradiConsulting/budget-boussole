<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Boussole</title>
<meta name="description" content="Suivi du budget familial à deux">
<meta name="theme-color" content="#1f4e5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1d2a30;
    --muted: #6b7a80;
    --line: #e3ddd2;
    --primary: #1f4e5f;
    --primary-soft: #e3eef1;
    --green: #2e7d4f;
    --green-soft: #e3f2e8;
    --orange: #c9701a;
    --orange-soft: #fbeedd;
    --red: #b8322a;
    --red-soft: #f8e1df;
    --grey: #a8b1b5;
    --radius: 14px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .hidden { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- Connexion ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 380px; background: var(--card); border-radius: 20px; padding: 28px 22px; box-shadow: 0 8px 30px rgba(31,78,95,.12); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand img { width: 48px; height: 48px; border-radius: 12px; }
  .brand h1 { margin: 0; font-size: 1.4rem; }
  .brand p { margin: 0; color: var(--muted); font-size: .9rem; }
  /* Œil pour afficher / masquer le mot de passe */
  label.field > span.pass-wrap { position: relative; display: block; font-size: 1rem; color: var(--ink); margin-bottom: 0; }
  .pass-wrap input { padding-right: 48px !important; }
  .eye { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 40px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; border-radius: 8px; }
  .eye:hover, .eye[aria-pressed="true"] { color: var(--primary); }

  /* ---------- Structure ---------- */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: var(--primary); color: #fff;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  }
  .top-row { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav button { background: rgba(255,255,255,.15); border: 0; color: #fff; width: 36px; height: 36px; border-radius: 10px; font-size: 1.2rem; }
  .month-nav button:disabled { opacity: .35; cursor: default; }
  #month-label { font-weight: 600; min-width: 140px; text-align: center; }
  #who { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 10px; padding: 7px 8px; }
  #who option { color: var(--ink); }
  main { max-width: 720px; margin: 0 auto; padding: 14px 16px calc(110px + env(safe-area-inset-bottom)); }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button { flex: 1; max-width: 180px; background: none; border: 0; padding: 10px 4px 12px; color: var(--muted); font-size: .8rem; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.tabs button span { font-size: 1.25rem; line-height: 1; }
  nav.tabs button.active { color: var(--primary); font-weight: 600; }
  #fab {
    position: fixed; right: max(16px, calc(50% - 344px)); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 11;
    width: 60px; height: 60px; border-radius: 50%; border: 0;
    background: var(--primary); color: #fff; font-size: 2rem; line-height: 1;
    box-shadow: 0 6px 18px rgba(31,78,95,.35);
  }

  /* ---------- Éléments communs ---------- */
  h2 { font-size: 1.1rem; margin: 18px 0 10px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--primary); color: #fff; font-weight: 600; }
  .btn.secondary { background: var(--primary-soft); color: var(--primary); }
  .btn.danger { background: var(--red-soft); color: var(--red); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .6; }
  .icon-btn { border: 0; background: none; color: var(--muted); padding: 6px 8px; border-radius: 8px; font-size: 1rem; }
  .icon-btn:hover { background: var(--bg); }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=password], input[type=date], select.input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .error { color: var(--red); font-size: .9rem; min-height: 1.2em; }
  .row { display: flex; align-items: center; gap: 8px; }
  .spacer { flex: 1; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }

  /* ---------- Bandeaux ---------- */
  .banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .banner.alert { background: var(--red-soft); border-left: 4px solid var(--red); }
  .banner.info { background: var(--primary-soft); border-left: 4px solid var(--primary); }
  .banner ul { margin: 6px 0 10px; padding-left: 18px; }
  .banner .btn { padding: 7px 12px; font-size: .9rem; }

  /* ---------- Tableau de bord ---------- */
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .total { background: var(--card); border-radius: var(--radius); padding: 10px; text-align: center; }
  .total b { display: block; font-size: 1.05rem; margin-top: 2px; }
  .total small { color: var(--muted); font-size: .78rem; }
  details.cat { background: var(--card); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; border-left: 5px solid var(--grey); }
  details.cat.green { border-left-color: var(--green); }
  details.cat.orange { border-left-color: var(--orange); }
  details.cat.red { border-left-color: var(--red); }
  details.cat > summary { list-style: none; padding: 12px 14px; cursor: pointer; }
  details.cat > summary::-webkit-details-marker { display: none; }
  .line-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .line-head .name { font-weight: 600; }
  .line-head .amounts { font-size: .9rem; white-space: nowrap; }
  .bar { height: 8px; background: var(--bg); border-radius: 6px; margin: 7px 0 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; background: var(--grey); }
  .bar i.green { background: var(--green); }
  .bar i.orange { background: var(--orange); }
  .bar i.red { background: var(--red); }
  .status { font-size: .82rem; }
  .status.green { color: var(--green); }
  .status.orange { color: var(--orange); }
  .status.red { color: var(--red); font-weight: 600; }
  .status.none { color: var(--muted); }
  .sub { padding: 10px 14px 10px 22px; border-top: 1px solid var(--line); }
  .sub .name { font-weight: 500; }
  .pill { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); margin-left: 6px; vertical-align: middle; }

  /* ---------- Dépenses ---------- */
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .exp { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .exp:first-child { border-top: 0; }
  .exp .date { width: 44px; text-align: center; font-size: .8rem; color: var(--muted); line-height: 1.15; }
  .exp .date b { display: block; font-size: 1.1rem; color: var(--ink); }
  .exp .info { flex: 1; min-width: 0; }
  .exp .info .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp .info .d { font-size: .8rem; color: var(--muted); }
  .exp .amt { font-weight: 600; white-space: nowrap; }
  .filters .wide { grid-column: 1 / -1; }
  /* Case « rapprochée avec la banque », tout à droite de chaque ligne */
  .exp .rec { width: 40px; height: 40px; margin: -8px -8px -8px 0; display: grid; place-items: center; flex: none; cursor: pointer; }
  .exp .rec input { width: 22px; height: 22px; margin: 0; accent-color: var(--green); cursor: pointer; }
  .exp .rec.none { cursor: default; }
  .exp.done .amt { color: var(--muted); }
  .rec-sum { display: flex; justify-content: space-between; gap: 8px; padding: 0 4px 10px; font-size: .9rem; }
  .rec-sum.todo { color: var(--orange); }
  .rec-sum.ok { color: var(--green); }
  .list { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .month-sum { display: flex; justify-content: space-between; padding: 0 4px 8px; color: var(--muted); font-size: .9rem; }

  /* ---------- Par moyen de paiement ---------- */
  details.pay-row { border-top: 1px solid var(--line); }
  details.pay-row:first-child { border-top: 0; }
  details.pay-row > summary { list-style: none; padding: 12px 14px; cursor: pointer; }
  details.pay-row > summary::-webkit-details-marker { display: none; }
  .bar i.pay { background: var(--primary); }
  .pay-cat { display: flex; justify-content: space-between; gap: 8px; padding: 7px 14px 7px 22px; border-top: 1px solid var(--line); font-size: .9rem; }
  .pay-cat span:last-child { white-space: nowrap; }
  .up { color: var(--red); }
  .down { color: var(--green); }

  /* ---------- Budget ---------- */
  .bcat { background: var(--card); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .bcat-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 14px; background: var(--primary-soft); }
  .bcat-head .name { font-weight: 600; flex: 1; }
  .bcat-head .sum { font-size: .9rem; color: var(--primary); margin-right: 4px; white-space: nowrap; }
  .bsub { display: grid; grid-template-columns: 1fr 108px; gap: 6px 8px; align-items: center; padding: 10px 8px 10px 14px; border-top: 1px solid var(--line); }
  .bsub .name { font-weight: 500; }
  .bsub .money-in { position: relative; }
  .bsub .money-in input { width: 100%; padding: 8px 24px 8px 8px; border: 1px solid var(--line); border-radius: 8px; text-align: right; background: #fff; }
  .bsub .money-in::after { content: "€"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .bsub .opts { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; font-size: .85rem; color: var(--muted); }
  .bsub .opts label { display: flex; align-items: center; gap: 6px; margin-right: auto; }
  .bsub .detail { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); }
  .add-sub { display: block; width: 100%; border: 0; border-top: 1px dashed var(--line); background: none; color: var(--primary); padding: 11px 14px; text-align: left; font-weight: 600; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .tr { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: .9rem; align-items: center; }
  .tr:first-child { border-top: 0; }
  .tr .info { flex: 1; }

  /* ---------- Réglages ---------- */
  .acc { display: flex; align-items: center; padding: 10px 8px 10px 14px; border-top: 1px solid var(--line); }
  .acc:first-child { border-top: 0; }
  .acc .name { flex: 1; }

  /* ---------- Fenêtres ---------- */
  dialog { border: 0; border-radius: 20px; padding: 0; width: min(440px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
  dialog::backdrop { background: rgba(20,30,35,.45); }
  dialog form { padding: 20px 18px 18px; }
  dialog h3 { margin: 0 0 14px; }
  .big-amount { font-size: 1.8rem !important; font-weight: 600; text-align: right; }
  .dlg-actions { display: flex; gap: 8px; margin-top: 6px; }
  .dlg-actions .btn { flex: 1; }

  #toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 50; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #loading { text-align: center; padding: 60px 16px; color: var(--muted); }

  /* ---------- Touches de fun (discrètes) ---------- */
  .phrase { display: flex; align-items: flex-start; gap: 10px; background: var(--card); border-radius: var(--radius); padding: 10px 6px 10px 14px; margin-bottom: 12px; font-size: .92rem; font-style: italic; color: var(--primary); }
  .phrase .ico { font-style: normal; font-size: 1.15rem; line-height: 1.2; }
  .phrase .txt { flex: 1; padding-top: 1px; }
  .banner.trophy { background: #fff6dc; border-left: 4px solid #d4a017; }
  details.fun { background: var(--card); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  details.fun > summary { list-style: none; padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  details.fun > summary::-webkit-details-marker { display: none; }
  details.fun > summary .name { font-weight: 600; }
  details.fun > summary .small { white-space: nowrap; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 0 12px 12px; }
  .badge { border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .badge .em { font-size: 1.7rem; line-height: 1.2; display: block; }
  .badge b { display: block; font-size: .88rem; margin: 2px 0; }
  .badge small { display: block; color: var(--muted); font-size: .75rem; line-height: 1.25; }
  .badge .n { display: inline-block; margin-top: 4px; font-size: .72rem; padding: 1px 7px; border-radius: 10px; background: var(--green-soft); color: var(--green); font-weight: 600; }
  .badge.locked { opacity: .45; }
  .badge.locked .em { filter: grayscale(1); }
  .duel { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .duel th, .duel td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: center; }
  .duel th:first-child, .duel td:first-child { text-align: left; color: var(--muted); font-weight: 400; }
  .duel .win { color: var(--green); font-weight: 600; }
  .fun-note { padding: 8px 14px 12px; margin: 0; }
  /* Écran d'accueil : image fixe 3 s sur téléphone, GIF 5,8 s sur ordinateur */
  #splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 24px; transition: opacity .35s; cursor: pointer; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash img { max-width: min(92vw, 520px); max-height: 70vh; border-radius: 20px; opacity: 0; transition: opacity .25s; }
  #splash img.ok { opacity: 1; }
  #splash .splash-in { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #splash h1 { margin: 0; font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 700; color: var(--primary); letter-spacing: .01em; text-align: center; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
</style>
</head>
<body>

<!-- ===================== Écran d'accueil ===================== -->
<!-- Téléphone : image fixe accueil.jpg pendant 3 s. Ordinateur : animation accueil.gif jouée une fois (5,8 s).
     Pour changer d'image, remplacer le fichier (même nom). Si l'image ne charge pas, l'application s'ouvre directement. -->
<div id="splash" role="presentation" aria-hidden="true">
  <div class="splash-in">
    <h1>Budget Boussole</h1>
    <img id="splash-img" alt="">
  </div>
</div>
<script>
(function () {
  var splash = document.getElementById("splash"), img = document.getElementById("splash-img"), done = false;
  // Téléphone ou tablette = écran tactile sans souris
  var phone = window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  var duree = phone ? 3000 : 5800;
  function hide() {
    if (done) return; done = true;
    splash.classList.add("out");
    setTimeout(function () { splash.remove(); }, 400);
  }
  var safety = setTimeout(hide, 4000);                       // image pas chargée en 4 s (connexion lente) : on passe
  function shown() { clearTimeout(safety); img.classList.add("ok"); setTimeout(hide, duree); }
  img.addEventListener("load", shown);
  img.addEventListener("error", hide);
  img.src = phone ? "accueil.jpg" : "accueil.gif";           // le téléphone ne télécharge jamais le GIF
  splash.addEventListener("click", hide);                    // un toucher pour passer
})();
</script>

<!-- ===================== Connexion ===================== -->
<div id="login" class="hidden">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div><h1>Budget Boussole</h1><p>Notre budget, à deux</p></div>
    </div>
    <label class="field"><span>Adresse e-mail</span><input type="email" id="login-email" autocomplete="username" required></label>
    <label class="field"><span>Mot de passe</span>
      <span class="pass-wrap">
        <input type="password" id="login-pass" autocomplete="current-password" required>
        <button type="button" class="eye" id="login-eye" aria-label="Afficher le mot de passe" aria-pressed="false" title="Afficher le mot de passe">
          <svg class="eye-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </span>
    </label>
    <div class="error" id="login-error"></div>
    <button class="btn block" type="submit" id="login-btn">Se connecter</button>
  </form>
</div>

<!-- ===================== Application ===================== -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <div class="month-nav">
        <button type="button" data-act="monthPrev" id="btn-prev" aria-label="Mois précédent">‹</button>
        <div id="month-label"></div>
        <button type="button" data-act="monthNext" id="btn-next" aria-label="Mois suivant">›</button>
      </div>
      <select id="who" aria-label="Filtrer par personne"></select>
    </div>
  </header>

  <main>
    <div id="loading">Chargement…</div>
    <section id="tab-dash" class="hidden"></section>
    <section id="tab-exp" class="hidden"></section>
    <section id="tab-budget" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
  </main>

  <button id="fab" type="button" data-act="newExpense" aria-label="Ajouter une dépense">+</button>

  <nav class="tabs">
    <button type="button" data-tab="dash" class="active"><span>◉</span>Tableau de bord</button>
    <button type="button" data-tab="exp"><span>☰</span>Dépenses</button>
    <button type="button" data-tab="budget"><span>✎</span>Budget</button>
    <button type="button" data-tab="settings"><span>⚙</span>Réglages</button>
  </nav>
</div>

<!-- ===================== Fenêtre dépense ===================== -->
<dialog id="dlg-expense">
  <form method="dialog" id="form-expense">
    <h3 id="exp-title">Nouvelle dépense</h3>
    <label class="field"><span>Montant (€)</span><input type="text" inputmode="decimal" id="exp-amount" class="big-amount" placeholder="0,00" autocomplete="off" required></label>
    <label class="field"><span>Poste</span><select class="input" id="exp-sub" required></select></label>
    <label class="field"><span>Payé avec</span><select class="input" id="exp-account" required></select></label>
    <label class="field"><span>Date</span><input type="date" id="exp-date" required></label>
    <label class="field"><span>Libellé (facultatif)</span><input type="text" id="exp-label" maxlength="80" autocomplete="off"></label>
    <div class="small muted" id="exp-who"></div>
    <div class="error" id="exp-error"></div>
    <div class="dlg-actions">
      <button type="button" class="btn secondary" data-act="closeDialog" data-id="dlg-expense">Annuler</button>
      <button type="submit" class="btn" id="exp-save">Enregistrer</button>
    </div>
    <button type="button" class="btn danger block hidden" id="exp-delete" data-act="deleteExpense" style="margin-top:10px">Supprimer cette dépense</button>
  </form>
</dialog>

<!-- ===================== Fenêtre transfert ===================== -->
<dialog id="dlg-transfer">
  <form method="dialog" id="form-transfer">
    <h3>Transférer entre postes</h3>
    <p class="small muted" id="tr-month"></p>
    <label class="field"><span>Prendre sur</span><select class="input" id="tr-from" required></select></label>
    <label class="field"><span>Donner à</span><select class="input" id="tr-to" required></select></label>
    <label class="field"><span>Montant (€)</span><input type="text" inputmode="decimal" id="tr-amount" placeholder="0,00" autocomplete="off" required></label>

/* =========================================================

try {

/* =========================================================
   Outils
   ========================================================= */
const $ = (s) => document.querySelector(s);
const fmt = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const round2 = (v) => Math.round(v * 100) / 100;
const money = (v) => fmt.format(round2(v || 0));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function addMonths(m, k) {
  let [y, mo] = m.split("-").map(Number);
  mo += k;
  while (mo > 12) { mo -= 12; y++; }
  while (mo < 1) { mo += 12; y--; }
  return `${y}-${pad(mo)}`;
}
function monthLabel(m) {
  const [y, mo] = m.split("-").map(Number);
  const s = new Date(y, mo - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function parseAmount(v) {
  const n = parseFloat(String(v).replace(/[\s €]/g, "").replace(",", "."));
  return Number.isFinite(n) ? round2(n) : NaN;
}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* stockage indisponible */ } }
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function fail(err) {
  console.error(err);
  const msg = err && err.code === "permission-denied"
    ? "Accès refusé par la base de données."
    : "Une erreur est survenue. Vérifiez votre connexion.";
  toast(msg);
}

const NOW_MONTH = todayStr().slice(0, 7);
const START = addMonths(NOW_MONTH, -HISTORY_MONTHS);
const MAX_MONTH = addMonths(NOW_MONTH, 12);
const RANK = { none: -1, green: 0, orange: 1, red: 2 };
const STATUS_TEXT = { green: "Il reste", orange: "Proche du plafond", red: "Dépassé", none: "Non budgété" };

/* =========================================================
   Phrases du jour : PROVISOIRES, à réécrire ensemble.
   Une phrase est tirée chaque jour selon l'état du budget du mois en cours :
   - debut  : du 1er au 3 du mois (si rien n'est orange ou rouge)
   - vert   : aucun poste orange ni rouge
   - orange : au moins un poste proche du plafond (aucun dépassé)
   - rouge  : au moins un poste dépassé
   Pour ajouter une phrase : une ligne entre guillemets, suivie d'une virgule.
   ========================================================= */
const PHRASES = {
  debut: [
    "Nouveau mois, page blanche : la boussole est remise à zéro.",
    "Le mois commence, c'est le moment idéal pour garder le cap."
  ],
  vert: [
    "Tout est au vert. La boussole indique le beau temps.",
    "Pas un nuage à l'horizon du budget. On continue comme ça !"
  ],
  orange: [
    "Quelques postes s'approchent du plafond : on lève un peu le pied.",
    "Petite brise orange sur le budget, rien de grave si on garde le cap."
  ],
  rouge: [
    "Un poste a dépassé son plafond. Un petit transfert peut tout remettre d'aplomb.",
    "La boussole s'agite un peu : on regarde ensemble où recadrer ?"
  ]
};

/* =========================================================
   État
   ========================================================= */
const S = {
  user: null,
  cats: [], subs: [], accounts: [],
  budgets: {}, expenses: [], transfers: [],
  month: NOW_MONTH, who: "all", tab: "dash",
  expCat: "all", expAcc: "all", expRec: "all",
  ready: new Set(),
  fresh: new Set(),   // collections confirmées par le serveur (pas seulement le cache local)
  editingExpense: null
};
let unsubs = [];
let memo = {};

const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name).localeCompare(String(b.name), "fr");
const activeCats = () => S.cats;
const activeSubs = () => S.subs.filter((s) => !s.archived && S.cats.some((c) => c.id === s.categoryId));
const subsOf = (catId, all = false) => S.subs.filter((s) => s.categoryId === catId && (all || !s.archived));
const subById = (id) => S.subs.find((s) => s.id === id);
const catById = (id) => S.cats.find((c) => c.id === id);
const subLabel = (id) => { const s = subById(id); if (!s) return "Poste supprimé"; const c = catById(s.categoryId); return (c ? c.name + " › " : "") + s.name; };
const accountName = (id) => id === CASH ? "Espèces" : (S.accounts.find((a) => a.id === id)?.name || "Compte supprimé");
// Texte « Rapprochée le 12/10/2026 par Maryline »
const recInfo = (e) => {
  const at = e.reconciledAt?.toDate ? e.reconciledAt.toDate().toLocaleDateString("fr-FR") : "";
  return `Rapprochée avec la banque${at ? " le " + at : ""}${e.reconciledBy ? " par " + (USERS[e.reconciledBy] || "?") : ""}`;
};

/* =========================================================
   Authentification
   ========================================================= */
// Œil : affiche ou masque le mot de passe pendant la saisie
function showPassword(show) {
  const input = $("#login-pass"), eye = $("#login-eye");
  input.type = show ? "text" : "password";
  eye.setAttribute("aria-pressed", String(show));
  const label = show ? "Masquer le mot de passe" : "Afficher le mot de passe";

  eye.querySelector(".eye-on").classList.toggle("hidden", show);
  eye.querySelector(".eye-off").classList.toggle("hidden", !show);
}
$("#login-eye").addEventListener("click", (e) => {

  const input = $("#login-pass");

  showPassword(input.type === "password");

  try { input.setSelectionRange(pos, pos); } catch { /* sans importance */ }

$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  showPassword(false); // on remasque avant l'envoi (et pour que le navigateur propose d'enregistrer le mot de passe)

onAuthStateChanged(auth, (user) => {
  unsubs.forEach((u) => u()); unsubs = [];
  S.ready.clear(); S.fresh.clear();
  if (!user) {
    S.user = null;
    showPassword(false);
    $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");

  }
  if (!USERS[user.uid]) {
    $("#login-error").textContent = "Ce compte n'est pas autorisé.";
    signOut(auth);
    return;
  }
  S.user = user;
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#who").innerHTML = `<option value="all">Tous</option>` +
    Object.entries(USERS).map(([uid, n]) => `<option value="${uid}">${esc(n)}</option>`).join("");
  $("#who").value = S.who;
  subscribe();

/* =========================================================
   Données en temps réel
   ========================================================= */
function subscribe() {
  const listen = (q, key, fn) => unsubs.push(onSnapshot(q, { includeMetadataChanges: true }, (snap) => { fn(snap); S.ready.add(key); if (snap.metadata.fromCache) S.fresh.delete(key); else S.fresh.add(key); render(); }, fail));
  const docs = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  listen(collection(db, "categories"), "cats", (s) => { S.cats = docs(s).sort(byOrder); });
  listen(collection(db, "subcategories"), "subs", (s) => { S.subs = docs(s).sort(byOrder); });
  listen(collection(db, "accounts"), "accounts", (s) => { S.accounts = docs(s).sort(byOrder); });
  listen(query(collection(db, "budgets"), where("month", ">=", START)), "budgets", (s) => {
    S.budgets = {};
    s.forEach((d) => { const b = d.data(); S.budgets[b.month + "_" + b.subId] = Number(b.amount) || 0; });
  });
  listen(query(collection(db, "expenses"), where("month", ">=", START)), "expenses", (s) => { S.expenses = docs(s); });
  listen(query(collection(db, "transfers"), where("month", ">=", START)), "transfers", (s) => { S.transfers = docs(s); });
}

/* =========================================================
   Calculs
   ========================================================= */
// Disponible = prévu + report du mois précédent + transferts reçus − transferts envoyés
function stats(m) {
  if (memo[m]) return memo[m];
  const prev = m > START ? stats(addMonths(m, -1)) : null;
  const r = {};
  for (const s of S.subs) {
    r[s.id] = { planned: S.budgets[m + "_" + s.id] || 0, carry: 0, tin: 0, tout: 0, spent: 0, byUser: {} };
    if (s.carryOver && prev && prev[s.id]) r[s.id].carry = round2(prev[s.id].available - prev[s.id].spent);
  }
  for (const t of S.transfers) {
    if (t.month !== m) continue;
    if (r[t.toSub]) r[t.toSub].tin += t.amount;
    if (r[t.fromSub]) r[t.fromSub].tout += t.amount;
  }
  for (const e of S.expenses) {
    if (e.month !== m || !r[e.subId]) continue;
    r[e.subId].spent += e.amount;
    r[e.subId].byUser[e.uid] = (r[e.subId].byUser[e.uid] || 0) + e.amount;
  }
  for (const id in r) {
    const x = r[id];
    x.spent = round2(x.spent);
    x.available = round2(x.planned + x.carry + x.tin - x.tout);
  }
  return (memo[m] = r);
}
function colorOf(avail, spent) {
  if (avail <= 0) return (spent > 0 || avail < 0) ? "red" : "none";
  const p = spent / avail;
  return p > 1 ? "red" : p >= ORANGE_THRESHOLD ? "orange" : "green";
}
function statusLine(avail, spent, color) {
  const rest = round2(avail - spent);
  if (color === "none") return "Non budgété";
  if (rest < 0) return `Dépassé de ${money(-rest)}`;
  return `${STATUS_TEXT[color]} ${money(rest)}`;
}
function barHtml(avail, spent, color) {
  const pct = avail > 0 ? Math.min(100, (spent / avail) * 100) : (spent > 0 ? 100 : 0);
  return `<div class="bar"><i class="${color}" style="width:${pct.toFixed(1)}%"></i></div>`;
}

/* =========================================================
   Affichage
   ========================================================= */
function render() {
  if (!S.user) return;
  memo = {};
  const loaded = S.ready.size >= 6;
  $("#loading").classList.toggle("hidden", loaded);
  $("#month-label").textContent = monthLabel(S.month);
  $("#btn-prev").disabled = S.month <= START;
  $("#btn-next").disabled = S.month >= MAX_MONTH;
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === S.tab));
  for (const t of ["dash", "exp", "budget", "settings"]) $("#tab-" + t).classList.toggle("hidden", !loaded || t !== S.tab);
  $("#fab").classList.toggle("hidden", S.tab === "settings");
  if (!loaded) return;
  if (S.tab === "dash") renderDash();
  if (S.tab === "exp") renderExpenses();
  if (S.tab === "budget") {
    // évite d'effacer une saisie en cours si l'autre personne modifie quelque chose
    if (document.activeElement?.matches?.("#tab-budget input[data-budget]")) { renderBudget.pending = true; }
    else renderBudget();
  }
  if (S.tab === "settings") renderSettings();
}

/* ---------- Tableau de bord ---------- */
function renderDash() {
  const st = stats(S.month);
  let html = trophyBannerHtml() + alertsHtml(st) + phraseHtml(st) + backupReminderHtml();

  if (!S.cats.length) {
    html += `<div class="card empty">
      <p>Bienvenue ! Commencez par créer vos catégories.</p>
      <button class="btn" data-act="seed">Créer mes 12 catégories</button>
    </div>`;
    $("#tab-dash").innerHTML = html;
    return;
  }

  let tAvail = 0, tSpent = 0;
  const who = S.who !== "all" ? S.who : null;
  const blocks = activeCats().map((c) => {
    const subs = subsOf(c.id, true).filter((s) => !s.archived || st[s.id]?.spent || st[s.id]?.available);
    let avail = 0, spent = 0, mine = 0;
    const rows = subs.map((s) => {
      const x = st[s.id];
      const col = colorOf(x.available, x.spent);
      avail += x.available; spent += x.spent;
      if (who) mine += x.byUser[who] || 0;
      return { s, x, col };
    }).sort((a, b) => RANK[b.col] - RANK[a.col] || byOrder(a.s, b.s));
    avail = round2(avail); spent = round2(spent);
    tAvail += avail; tSpent += spent;
    return { c, rows, avail, spent, mine, col: colorOf(avail, spent) };
  }).sort((a, b) => RANK[b.col] - RANK[a.col] || byOrder(a.c, b.c));

  tAvail = round2(tAvail); tSpent = round2(tSpent);
  const tRest = round2(tAvail - tSpent);
  html += `<div class="totals">
    <div class="total"><small>Budget</small><b>${money(tAvail)}</b></div>
    <div class="total"><small>Dépensé</small><b>${money(tSpent)}</b></div>
    <div class="total"><small>${tRest < 0 ? "Dépassement" : "Reste"}</small><b style="color:var(--${tRest < 0 ? "red" : "green"})">${money(Math.abs(tRest))}</b></div>
  </div>`;
  if (who) html += `<p class="small muted" style="margin:-4px 0 12px">Montants en bleu : part de ${esc(USERS[who])}. Les couleurs restent calculées sur le budget commun.</p>`;

  for (const b of blocks) {
    const open = b.col === "red" || b.col === "orange";
    html += `<details class="cat ${b.col}" ${open ? "open" : ""}>
      <summary>
        <div class="line-head"><span class="name">${esc(b.c.name)}</span><span class="amounts">${money(b.spent)} / ${money(b.avail)}</span></div>
        ${barHtml(b.avail, b.spent, b.col)}
        <div class="status ${b.col}">${statusLine(b.avail, b.spent, b.col)}${who && b.mine ? ` <span class="pill">${esc(USERS[who])} : ${money(b.mine)}</span>` : ""}</div>
      </summary>
      ${b.rows.length ? b.rows.map(({ s, x, col }) => `
        <div class="sub">
          <div class="line-head"><span class="name">${esc(s.name)}${s.archived ? ' <span class="pill">archivé</span>' : ""}</span><span class="amounts">${money(x.spent)} / ${money(x.available)}</span></div>
          ${barHtml(x.available, x.spent, col)}
          <div class="status ${col}">${statusLine(x.available, x.spent, col)}${who && x.byUser[who] ? ` <span class="pill">${esc(USERS[who])} : ${money(x.byUser[who])}</span>` : ""}</div>
        </div>`).join("") : `<div class="sub small muted">Aucune sous-catégorie. Ajoutez-en dans l'onglet Budget.</div>`}
    </details>`;
  }
  html += paymentHtml() + duelHtml() + trophiesHtml();
  $("#tab-dash").innerHTML = html;
}

/* ---------- Analyse par moyen de paiement ---------- */
function paymentHtml() {
  const prevM = addMonths(S.month, -1);
  const prevName = monthLabel(prevM).split(" ")[0].toLowerCase();
  const pick = (m) => S.expenses.filter((e) => e.month === m && (S.who === "all" || e.uid === S.who));
  const agg = (list) => {
    const r = {};
    for (const e of list) {
      const a = r[e.accountId] || (r[e.accountId] = { total: 0, n: 0, cats: {} });
      a.total += e.amount; a.n++;
      const cid = subById(e.subId)?.categoryId || "?";
      a.cats[cid] = (a.cats[cid] || 0) + e.amount;
    }
    return r;
  };
  const cur = pick(S.month);
  const title = `<h2>Par moyen de paiement${S.who !== "all" ? ` · ${esc(USERS[S.who])}` : ""}</h2>`;
  if (!cur.length) return title + `<p class="small muted">Aucune dépense ce mois-ci.</p>`;
  const A = agg(cur), P = agg(pick(prevM));
  const total = round2(cur.reduce((t, e) => t + e.amount, 0));
  const rows = Object.entries(A)
    .map(([id, a]) => ({ id, n: a.n, cats: a.cats, total: round2(a.total), prev: round2(P[id]?.total || 0) }))
    .sort((x, y) => y.total - x.total);

  return title + `<div class="list">${rows.map((r) => {
    const pct = total ? (r.total / total) * 100 : 0;
    const diff = round2(r.total - r.prev);
    const cmp = !r.prev ? `rien en ${prevName}`
      : diff === 0 ? `identique à ${prevName}`
      : `<span class="${diff > 0 ? "up" : "down"}">${diff > 0 ? "+" : "−"}${money(Math.abs(diff))}</span> par rapport à ${prevName}`;
    const cats = Object.entries(r.cats).sort((a, b) => b[1] - a[1])
      .map(([cid, v]) => `<div class="pay-cat"><span>${esc(catById(cid)?.name || "Autre")}</span><span>${money(v)}</span></div>`).join("");
    return `<details class="pay-row">
      <summary>
        <div class="line-head"><span class="name">${esc(accountName(r.id))}</span><span class="amounts"><b>${money(r.total)}</b></span></div>
        <div class="bar"><i class="pay" style="width:${pct.toFixed(1)}%"></i></div>
        <div class="small muted">${Math.round(pct)} % des dépenses · ${r.n} dépense${r.n > 1 ? "s" : ""} · ${cmp}</div>
      </summary>
      ${cats}
      <button class="add-sub" data-act="showAccount" data-id="${r.id}">Voir le détail des dépenses</button>
    </details>`;
  }).join("")}</div>`;
}

function seenKey() { return `bb_seen_${S.user.uid}_${NOW_MONTH}`; }
function currentStatuses(st) {
  const cur = {};
  activeSubs().forEach((s) => { cur[s.id] = colorOf(st[s.id].available, st[s.id].spent); });
  return cur;
}
function alertsHtml(st) {
  if (S.month !== NOW_MONTH) return "";
  const seen = lsGet(seenKey(), {});
  const cur = currentStatuses(st);
  const items = activeSubs().filter((s) => {
    const c = cur[s.id];
    return (c === "orange" || c === "red") && RANK[c] > RANK[seen[s.id] || "green"];
  });
  if (!items.length) return "";
  return `<div class="banner alert">
    <b>Depuis votre dernière visite</b>
    <ul>${items.map((s) => {
      const x = st[s.id], c = cur[s.id];
      return `<li>${esc(subLabel(s.id))} : ${c === "red" ? "<b>dépassé</b>" : "proche du plafond"} (${money(x.spent)} / ${money(x.available)})</li>`;
    }).join("")}</ul>
    <button class="btn" data-act="ackAlerts">J'ai vu</button>
  </div>`;
}
function backupReminderHtml() {
  if (lsGet("bb_last_backup", "") === NOW_MONTH) return "";
  return `<div class="banner info">
    <b>Sauvegarde du mois</b><br>
    <span class="small">Pensez à télécharger une sauvegarde de vos données (une fois par mois).</span>
    <div style="margin-top:8px"><button class="btn" data-act="backup">Télécharger la sauvegarde</button></div>
  </div>`;
}

/* =========================================================
   Fun : phrase du jour, trophées, duel, confettis
   Tout est calculé à partir des données existantes : aucune nouvelle
   collection Firestore, donc aucune règle de sécurité à modifier.
   ========================================================= */
const storageOk = (() => { try { localStorage.setItem("bb_t", "1"); localStorage.removeItem("bb_t"); return true; } catch { return false; } })();

// Confettis légers (désactivés si le téléphone demande de réduire les animations)
function confetti() {
  if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) return;
  if (document.getElementById("confetti")) return;
  const cv = document.createElement("canvas"); cv.id = "confetti";
  document.body.appendChild(cv);
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const colors = ["#1f4e5f", "#2e7d4f", "#c9701a", "#d4a017", "#5aa3b8"];
  const parts = Array.from({ length: 70 }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .4, y: H * .35,
    vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3,
    w: 6 + Math.random() * 5, h: 3 + Math.random() * 4,
    r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const t0 = performance.now(), DUR = 1800;
  (function frame(t) {
    const k = (t - t0) / DUR;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - .6) / .4);
    for (const p of parts) {
      p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (k < 1) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* ---------- Phrase du jour ---------- */
function phraseHtml(st) {
  if (S.month !== NOW_MONTH || !S.cats.length) return "";
  const today = todayStr();
  if (lsGet("bb_phrase_hidden", "") === today) return "";
  const cols = Object.values(currentStatuses(st));
  const mood = cols.includes("red") ? "rouge" : cols.includes("orange") ? "orange" : Number(today.slice(8, 10)) <= 3 ? "debut" : "vert";
  const list = PHRASES[mood] || [];
  if (!list.length) return "";
  // même phrase toute la journée (pas de changement à chaque rafraîchissement)
  const seed = [...today].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const ico = { debut: "🧭", vert: "☀️", orange: "🌤️", rouge: "🌧️" }[mood];
  return `<div class="phrase"><span class="ico">${ico}</span><span class="txt">${esc(list[seed % list.length])}</span>
    <button class="icon-btn" data-act="hidePhrase" title="Masquer pour aujourd'hui" aria-label="Masquer la phrase du jour">✕</button></div>`;
}

/* ---------- Trophées ---------- */
// Bilan d'un mois : couleurs des postes, totaux, rapprochement, présence des deux personnes
function monthReport(m) {
  const st = stats(m);
  const cols = [];
  let avail = 0, spent = 0;
  for (const s of S.subs) {
    const x = st[s.id];
    if (!x || !catById(s.categoryId) || (x.available === 0 && x.spent === 0)) continue;
    cols.push(colorOf(x.available, x.spent));
    avail += x.available; spent += x.spent;
  }
  avail = round2(avail); spent = round2(spent);
  const exps = S.expenses.filter((e) => e.month === m);
  const banked = exps.filter((e) => e.accountId !== CASH);
  const budgeted = cols.length > 0 && avail > 0;
  return {
    budgeted,
    noRed: budgeted && !cols.includes("red"),
    allGreen: budgeted && cols.every((c) => c === "green"),
    under: budgeted && spent <= avail,
    perfectRec: banked.length > 0 && banked.every((e) => e.reconciled),
    duo: Object.keys(USERS).every((u) => exps.some((e) => e.uid === u))
  };
}
function computeBadges() {
  // Mois terminés uniquement. Le plus ancien mois chargé est exclu : son report du mois d'avant est inconnu.
  const R = [];
  for (let m = addMonths(START, 1); m < NOW_MONTH; m = addMonths(m, 1)) R.push(monthReport(m));
  const count = (f) => R.filter(f).length;
  let streak = 0, best = 0;
  for (const r of R) { streak = r.noRed ? streak + 1 : 0; best = Math.max(best, streak); }
  const duo = count((r) => r.duo) + (monthReport(NOW_MONTH).duo ? 1 : 0);
  return [
    { id: "premier", em: "👣", name: "Premier pas", how: "Enregistrer une première dépense", n: S.expenses.length ? 1 : 0, once: true },
    { id: "duo", em: "🤝", name: "En duo", how: "Un mois où chacun saisit au moins une dépense", n: duo },
    { id: "sous", em: "🐷", name: "Sous le budget", how: "Finir un mois en dépensant moins que le budget total", n: count((r) => r.under) },
    { id: "zerorouge", em: "🛡️", name: "Zéro rouge", how: "Finir un mois sans aucun poste dépassé", n: count((r) => r.noRed) },
    { id: "vert", em: "🌿", name: "Mois 100 % vert", how: "Finir un mois avec tous les postes au vert", n: count((r) => r.allGreen) },
    { id: "pointage", em: "✅", name: "Pointage parfait", how: "Finir un mois avec toutes les dépenses bancaires rapprochées", n: count((r) => r.perfectRec) },
    { id: "serie", em: "🔥", name: "Série de 3", how: "3 mois de suite sans poste dépassé", n: best >= 3 ? 1 : 0, once: true, extra: streak ? `Série en cours : ${streak} mois` : "" }
  ];
}

let celebrated = "";

/* ---------- Duel amical ---------- */
function duelHtml() {
  const exps = S.expenses.filter((e) => e.month === S.month);

  const uids = Object.keys(USERS);
  const rows = [
    { label: "Dépenses saisies", v: (u) => exps.filter((e) => e.uid === u).length },
    { label: "Dépenses pointées", v: (u) => exps.filter((e) => e.accountId !== CASH && e.reconciled && e.reconciledBy === u).length },
    { label: "Jours de saisie", v: (u) => new Set(exps.filter((e) => e.uid === u).map((e) => e.date)).size }
  ].map((r) => ({ label: r.label, vals: uids.map(r.v) }));
  const score = [0, 1].map((i) => rows.filter((r) => r.vals[i] > r.vals[1 - i]).length);

  const lead = score[0] === score[1] ? "Égalité parfaite 🤝" : `${esc(USERS[uids[score[0] > score[1] ? 0 : 1]])} mène 👑`;
  return `<details class="fun">

$("#form-expense").addEventListener("submit", async (e) => {
  e.preventDefault();
  const amount = parseAmount($("#exp-amount").value);
  const subId = $("#exp-sub").value, accountId = $("#exp-account").value, date = $("#exp-date").value;
  if (!(amount > 0)) { $("#exp-error").textContent = "Saisissez un montant supérieur à 0."; return; }
  if (!subId || !accountId || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { $("#exp-error").textContent = "Complétez tous les champs obligatoires."; return; }
  if (date.slice(0, 7) < START) { $("#exp-error").textContent = "Cette date est trop ancienne (plus de 12 mois)."; return; }
  const data = { amount, subId, accountId, date, month: date.slice(0, 7), label: $("#exp-label").value.trim(), updatedAt: serverTimestamp() };
  // Une dépense passée en espèces ne peut pas rester « rapprochée avec la banque »
  if (S.editingExpense?.reconciled && accountId === CASH) Object.assign(data, { reconciled: false, reconciledBy: null, reconciledAt: null });
  const btn = $("#exp-save"); btn.disabled = true;
  try {
    if (S.editingExpense) {
      await updateDoc(doc(db, "expenses", S.editingExpense.id), data);
    } else {
      await addDoc(collection(db, "expenses"), { ...data, uid: S.user.uid, createdAt: serverTimestamp() });
    }
    lsSet("bb_last_sub", subId);
    lsSet("bb_last_acc_" + S.user.uid, accountId);
    $("#dlg-expense").close();
    toast(S.editingExpense ? "Dépense modifiée" : "Dépense enregistrée");
    if (data.month !== S.month && !S.editingExpense) { S.month = data.month; render(); }
  } catch (err) { fail(err); } finally { btn.disabled = false; }
});

/* =========================================================
   Fenêtre transfert
   ========================================================= */
$("#form-transfer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fromSub = $("#tr-from").value, toSub = $("#tr-to").value, amount = parseAmount($("#tr-amount").value);
  if (fromSub === toSub) { $("#tr-error").textContent = "Choisissez deux postes différents."; return; }
  if (!(amount > 0)) { $("#tr-error").textContent = "Saisissez un montant supérieur à 0."; return; }
  try {
    await addDoc(collection(db, "transfers"), { month: S.month, fromSub, toSub, amount, uid: S.user.uid, date: todayStr(), createdAt: serverTimestamp() });
    $("#dlg-transfer").close();
    toast("Transfert effectué");
  } catch (err) { fail(err); }
});

/* =========================================================
   Actions
   ========================================================= */
async function isUsed(field, id) {
  const snap = await getDocs(query(collection(db, "expenses"), where(field, "==", id), limit(1)));
  return !snap.empty;
}
async function swapOrder(list, id, dir, coll) {
  const i = list.findIndex((x) => x.id === id), j = i + Number(dir);
  if (i < 0 || j < 0 || j >= list.length) return;
  const b = writeBatch(db);
  // réattribue un ordre propre à toute la liste, puis échange les deux éléments
  const ordered = [...list];
  [ordered[i], ordered[j]] = [ordered[j], ordered[i]];
  ordered.forEach((x, k) => b.update(doc(db, coll, x.id), { order: k }));
  await b.commit();
}
const ask = (msg, def = "") => { const v = prompt(msg, def); return v === null ? null : v.trim(); };

const actions = {
  monthPrev() { if (S.month > START) { S.month = addMonths(S.month, -1); render(); } },
  monthNext() { if (S.month < MAX_MONTH) { S.month = addMonths(S.month, 1); render(); } },
  newExpense() { openExpense(null); },
  editExpense(id) { const e = S.expenses.find((x) => x.id === id); if (e) openExpense(e); },
  async deleteExpense() {
    const e = S.editingExpense; if (!e) return;
    if (!confirm(`Supprimer cette dépense de ${money(e.amount)} ?`)) return;
    try { await deleteDoc(doc(db, "expenses", e.id)); $("#dlg-expense").close(); toast("Dépense supprimée"); } catch (err) { fail(err); }
  },
  closeDialog(id) { $("#" + id).close(); },
  showAccount(id) { S.expAcc = id; S.expCat = "all"; S.expRec = "all"; S.tab = "exp"; render(); window.scrollTo(0, 0); },
  ackAlerts() { lsSet(seenKey(), currentStatuses(stats(NOW_MONTH))); render(); },
  hidePhrase() { lsSet("bb_phrase_hidden", todayStr()); render(); },
  ackTrophies() { lsSet(trophyKey(), computeBadges().filter((b) => b.n > 0).map((b) => b.id)); render(); },

  async seed() {
    if (S.cats.length) return;
    const b = writeBatch(db);
    DEFAULT_CATS.forEach((name, i) => b.set(doc(collection(db, "categories")), { name, order: i }));
    try { await b.commit(); toast("Catégories créées"); S.tab = "budget"; render(); } catch (err) { fail(err); }
  },
  async addCat() {
    const name = ask("Nom de la nouvelle catégorie :"); if (!name) return;
    try { await addDoc(collection(db, "categories"), { name, order: Date.now() }); } catch (err) { fail(err); }
  },
  async renameCat(id) {
    const c = catById(id); const name = ask("Nouveau nom :", c?.name); if (!name) return;
    try { await updateDoc(doc(db, "categories", id), { name }); } catch (err) { fail(err); }
  },
  async deleteCat(id) {
    const c = catById(id);
    if (subsOf(id).length) { alert(`Supprimez d'abord les sous-catégories de « ${c.name} ».`); return; }
    if (!confirm(`Supprimer la catégorie « ${c.name} » ?`)) return;
    try { await deleteDoc(doc(db, "categories", id)); } catch (err) { fail(err); }
  },
  moveCat(id, el) { swapOrder(S.cats, id, el.dataset.dir, "categories").catch(fail); },

  async addSub(catId) {
    const c = catById(catId);
    const name = ask(`Nouvelle sous-catégorie dans « ${c?.name} » :`); if (!name) return;
    try { await addDoc(collection(db, "subcategories"), { name, categoryId: catId, order: Date.now(), carryOver: false, archived: false }); }
    catch (err) { fail(err); }
  },
  async renameSub(id) {
    const s = subById(id); const name = ask("Nouveau nom :", s?.name); if (!name) return;
    try { await updateDoc(doc(db, "subcategories", id), { name }); } catch (err) { fail(err); }
  },
  async deleteSub(id) {
    const s = subById(id);
    try {
      if (await isUsed("subId", id)) {
        if (!confirm(`« ${s.name} » contient des dépenses.\nElle sera archivée : masquée du budget et de la saisie, mais son historique est conservé.\n\nContinuer ?`)) return;
        await updateDoc(doc(db, "subcategories", id), { archived: true });
        toast("Sous-catégorie archivée");
      } else {
        if (!confirm(`Supprimer la sous-catégorie « ${s.name} » ?`)) return;
        await deleteDoc(doc(db, "subcategories", id));
      }
    } catch (err) { fail(err); }
  },
  moveSub(id, el) { const s = subById(id); swapOrder(subsOf(s.categoryId), id, el.dataset.dir, "subcategories").catch(fail); },

  async copyPrev() {
    const prev = addMonths(S.month, -1);
    const subs = activeSubs().filter((s) => S.budgets[prev + "_" + s.id] !== undefined && S.budgets[S.month + "_" + s.id] === undefined);
    if (!subs.length) { alert(`Rien à copier : aucun montant en ${monthLabel(prev).toLowerCase()}, ou tous les postes de ${monthLabel(S.month).toLowerCase()} sont déjà remplis.`); return; }
    if (!confirm(`Copier les montants de ${monthLabel(prev).toLowerCase()} sur ${monthLabel(S.month).toLowerCase()} ?\n(${subs.length} poste(s) vide(s) seront remplis ; les montants déjà saisis ne changent pas.)`)) return;
    const b = writeBatch(db);
    subs.forEach((s) => b.set(doc(db, "budgets", `${S.month}_${s.id}`), { month: S.month, subId: s.id, amount: S.budgets[prev + "_" + s.id] }));
    try { await b.commit(); toast("Budget copié"); } catch (err) { fail(err); }
  },
  openTransfer() {
    if (activeSubs().length < 2) { alert("Il faut au moins deux sous-catégories pour faire un transfert."); return; }
    fillSubSelect($("#tr-from")); fillSubSelect($("#tr-to"));
    $("#tr-amount").value = ""; $("#tr-error").textContent = "";
    $("#tr-month").textContent = `Pour ${monthLabel(S.month).toLowerCase()}`;
    $("#dlg-transfer").showModal();
  },
  async deleteTransfer(id) {
    const t = S.transfers.find((x) => x.id === id);
    if (!confirm(`Annuler le transfert de ${money(t.amount)} ?`)) return;
    try { await deleteDoc(doc(db, "transfers", id)); } catch (err) { fail(err); }
  },

  async addAcc() {
    const name = ask("Nom du compte ou de la carte (ex. : Compte joint, Carte de Jean-Pierre) :\nNe saisissez jamais de numéro de carte ou d'IBAN."); if (!name) return;
    try { await addDoc(collection(db, "accounts"), { name, order: Date.now(), archived: false }); } catch (err) { fail(err); }
  },
  async renameAcc(id) {
    const a = S.accounts.find((x) => x.id === id); const name = ask("Nouveau nom :", a?.name); if (!name) return;
    try { await updateDoc(doc(db, "accounts", id), { name }); } catch (err) { fail(err); }
  },
  async deleteAcc(id) {
    const a = S.accounts.find((x) => x.id === id);
    try {
      if (await isUsed("accountId", id)) {
        if (!confirm(`« ${a.name} » est utilisé par des dépenses.\nIl sera archivé : masqué de la saisie, historique conservé.\n\nContinuer ?`)) return;
        await updateDoc(doc(db, "accounts", id), { archived: true });
      } else {
        if (!confirm(`Supprimer « ${a.name} » ?`)) return;
        await deleteDoc(doc(db, "accounts", id));
      }
    } catch (err) { fail(err); }
  },

  async backup() {
    toast("Préparation de la sauvegarde…");
    try {
      const out = { application: "Budget Boussole", exportedAt: new Date().toISOString(), exportedBy: USERS[S.user.uid] };
      for (const c of ["categories", "subcategories", "accounts", "budgets", "expenses", "transfers"]) {
        const snap = await getDocs(collection(db, c));
        out[c] = snap.docs.map((d) => {
          const v = { id: d.id, ...d.data() };
          for (const k in v) if (v[k] && typeof v[k].toDate === "function") v[k] = v[k].toDate().toISOString();
          return v;
        });
      }
      const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `budget-boussole-sauvegarde-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      lsSet("bb_last_backup", NOW_MONTH);
      toast("Sauvegarde téléchargée");
      render();
    } catch (err) { fail(err); }
  },
  logout() { if (confirm("Se déconnecter ?")) signOut(auth); }
};

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  // La case de rapprochement se coche sans ouvrir la fiche de la dépense
  if (e.target.closest(".exp .rec")) return;
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  if (b.tagName === "SUMMARY") return;
  const fn = actions[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b.dataset.id, b); }
});

document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "who") { S.who = t.value; render(); return; }
  if (t.id === "f-cat") { S.expCat = t.value; render(); return; }
  if (t.id === "f-acc") { S.expAcc = t.value; render(); return; }
  if (t.id === "f-rec") { S.expRec = t.value; render(); return; }
  if (t.dataset.rec) {
    const on = t.checked;
    // Dernière dépense bancaire du mois à pointer : petite fête
    const ex = S.expenses.find((x) => x.id === t.dataset.rec);
    const allDone = on && !!ex && S.expenses.every((x) => x.month !== ex.month || x.accountId === CASH || x.id === ex.id || x.reconciled);
    if (allDone) confetti();
    try {
      await updateDoc(doc(db, "expenses", t.dataset.rec), on
        ? { reconciled: true, reconciledBy: S.user.uid, reconciledAt: serverTimestamp() }
        : { reconciled: false, reconciledBy: null, reconciledAt: null });
      toast(allDone ? `Tout est rapproché pour ${monthLabel(ex.month).toLowerCase()} 🎉` : on ? "Dépense rapprochée" : "Rapprochement annulé");
    } catch (err) { t.checked = !on; fail(err); }
    return;
  }
  if (t.dataset.budget) {
    const raw = t.value.trim();
    const amount = raw === "" ? 0 : parseAmount(raw);
    if (!(amount >= 0)) { toast("Montant invalide"); t.value = ""; return; }
    try { await setDoc(doc(db, "budgets", `${S.month}_${t.dataset.budget}`), { month: S.month, subId: t.dataset.budget, amount }); }
    catch (err) { fail(err); }
    return;
  }
  if (t.dataset.carry) {
    try { await updateDoc(doc(db, "subcategories", t.dataset.carry), { carryOver: t.checked }); } catch (err) { fail(err); }
  }
});

// Après une saisie de montant, on rafraîchit l'onglet Budget s'il avait été mis en attente
document.addEventListener("focusout", (e) => {
  if (e.target.matches?.("input[data-budget]")) setTimeout(() => { if (renderBudget.pending && S.tab === "budget") render(); }, 0);
});

// Valider un montant avec la touche Entrée
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches?.("input[data-budget]")) e.target.blur();
});

  navigator.serviceWorker.register("sw.js").catch(() => {});
}
